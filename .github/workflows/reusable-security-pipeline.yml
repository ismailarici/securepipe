name: Reusable Security Pipeline

on:
  workflow_call:
    inputs:
      app-language:
        description: "Programming language of the app (python, node, java)"
        required: true
        type: string
      image-name:
        description: "Docker image name (repository name, without registry prefix or tag)"
        required: true
        type: string
      app-port:
        description: "Port the application exposes"
        required: false
        type: string
        default: "5000"
      fail-severity:
        description: "Trivy severity level that fails the build (CRITICAL, HIGH, MEDIUM)"
        required: false
        type: string
        default: "HIGH"
      aws-region:
        description: "AWS region for ECR"
        required: false
        type: string
        default: "us-east-1"
      cloud-provider:
        description: "Cloud provider for image registry (aws, azure, gcp)"
        required: false
        type: string
        default: "aws"
      registry-url:
        description: |
          Registry hostname for Azure and GCP.
          Azure example: myorg.azurecr.io
          GCP example: us-central1-docker.pkg.dev/my-project/my-repo
          AWS: leave blank — derived automatically from AWS_ACCOUNT_ID and aws-region.
        required: false
        type: string
        default: ""
      reporting-mode:
        description: "sarif uploads findings to the GitHub Security tab; artifacts uploads SARIF files as downloadable run artifacts (use for private repos without GHAS)"
        required: false
        type: string
        default: "sarif"
      defectdojo-url:
        description: "Base URL of your DefectDojo instance (e.g. https://defectdojo.example.com). When set, all findings are imported into DefectDojo after scanning."
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCOUNT_ID:
        required: false
      AWS_ROLE_ARN:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      SEMGREP_APP_TOKEN:
        required: false
      DEFECTDOJO_TOKEN:
        required: false

jobs:
  secrets-scan:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  bandit-scan:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.app-language == 'python' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit -r . \
            -x ./tests,./sample-apps \
            -f sarif \
            -o bandit-results.sarif \
            || true

      - name: Upload Bandit SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload Bandit SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: bandit-sarif
          path: bandit-results.sarif
          retention-days: 30

      - name: Upload Bandit SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-bandit-sarif
          path: bandit-results.sarif
          retention-days: 1

  semgrep-scan:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/docker \
            --config p/terraform \
            --config .semgrep/ \
            --sarif \
            --output semgrep.sarif \
            || true

      - name: Upload Semgrep SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

      - name: Upload Semgrep SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-semgrep-sarif
          path: semgrep.sarif
          retention-days: 1

  pip-audit-scan:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.app-language == 'python' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit \
            -r app/requirements.txt \
            -f json \
            -o pip-audit-results.json \
            || true

      - name: Convert pip-audit JSON to SARIF
        run: python3 -c "import json; data=json.load(open('pip-audit-results.json')); results=[{'ruleId':v.get('id','UNKNOWN'),'message':{'text':v.get('description','')},'locations':[{'physicalLocation':{'artifactLocation':{'uri':'app/requirements.txt'}}}]} for d in data.get('dependencies',[]) for v in d.get('vulns',[])]; json.dump({'version':'2.1.0','runs':[{'tool':{'driver':{'name':'pip-audit','rules':[]}},'results':results}]},open('pip-audit-results.sarif','w')); print(len(results),'findings')"

      - name: Upload pip-audit SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

      - name: Upload pip-audit SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: pip-audit-sarif
          path: pip-audit-results.sarif
          retention-days: 30

      - name: Upload Pip Audit SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-pip-audit-sarif
          path: pip-audit-results.sarif
          retention-days: 1

  npm-audit-scan:
    name: npm-audit Dependency Scan
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: ${{ inputs.app-language == 'node' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefix app || true

      - name: Run npm audit
        run: |
          npm audit --json --prefix app > npm-audit-results.json || true

      - name: Convert npm-audit JSON to SARIF
        run: |
          echo '' | base64 -d > /tmp/npm_to_sarif.py
          python3 /tmp/npm_to_sarif.py

      - name: Upload npm-audit SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: npm-audit-results.sarif
          category: npm-audit

      - name: Upload npm-audit SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: npm-audit-sarif
          path: npm-audit-results.sarif
          retention-days: 30

      - name: Upload Npm Audit SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-npm-audit-sarif
          path: npm-audit-results.sarif
          retention-days: 1

  build-and-sbom:
    name: Build Image and Generate SBOM
    runs-on: ubuntu-latest
    needs: secrets-scan
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ inputs.image-name }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.set-tag.outputs.tag }} \
            -f app/Dockerfile \
            app/

      - name: Authenticate to AWS
        if: inputs.cloud-provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: inputs.cloud-provider == 'aws'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: inputs.cloud-provider == 'aws'
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          docker tag ${{ steps.set-tag.outputs.tag }} ${ECR_REGISTRY}/${{ steps.set-tag.outputs.tag }}
          push_out=$(docker push ${ECR_REGISTRY}/${{ steps.set-tag.outputs.tag }} 2>&1) && echo "$push_out" || {
            # Immutable ECR repos reject a re-push of the same tag — that is a no-op, not a failure.
            echo "$push_out"
            echo "$push_out" | grep -q "already exists" || exit 1
            echo "Image already present in ECR for this SHA, skipping push"
          }

      - name: Authenticate to Azure
        if: inputs.cloud-provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: inputs.cloud-provider == 'azure'
        run: az acr login --name ${{ inputs.registry-url }}

      - name: Push image to ACR
        if: inputs.cloud-provider == 'azure'
        run: |
          docker tag ${{ steps.set-tag.outputs.tag }} ${{ inputs.registry-url }}/${{ steps.set-tag.outputs.tag }}
          docker push ${{ inputs.registry-url }}/${{ steps.set-tag.outputs.tag }}

      - name: Authenticate to GCP
        if: inputs.cloud-provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Google Artifact Registry
        if: inputs.cloud-provider == 'gcp'
        run: gcloud auth configure-docker ${{ inputs.registry-url }} --quiet

      - name: Push image to Google Artifact Registry
        if: inputs.cloud-provider == 'gcp'
        run: |
          docker tag ${{ steps.set-tag.outputs.tag }} ${{ inputs.registry-url }}/${{ steps.set-tag.outputs.tag }}
          docker push ${{ inputs.registry-url }}/${{ steps.set-tag.outputs.tag }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft ${{ steps.set-tag.outputs.tag }} \
            -o spdx-json=sbom.spdx.json \
            -o table

      - name: Export Docker image
        run: |
          docker save ${{ steps.set-tag.outputs.tag }} -o container-image.tar

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: container-image.tar
          retention-days: 1

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build-and-sbom
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download container image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load Docker image
        run: |
          docker load -i container-image.tar
          docker tag $(docker images -q | head -1) ${{ needs.build-and-sbom.outputs.image-tag }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-sbom.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.fail-severity }}
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-trivy-sarif
          path: trivy-results.sarif
          retention-days: 1

  checkov-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Upload Checkov SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: checkov-sarif
          path: checkov-results.sarif
          retention-days: 30

      - name: Upload Checkov SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-checkov-sarif
          path: checkov-results.sarif
          retention-days: 1

  zap-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: build-and-sbom
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download container image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load Docker image
        run: |
          docker load -i container-image.tar
          docker tag $(docker images -q | head -1) ${{ needs.build-and-sbom.outputs.image-tag }}

      - name: Start application
        run: |
          docker run -d \
            --name target-app \
            -p ${{ inputs.app-port }}:${{ inputs.app-port }} \
            ${{ needs.build-and-sbom.outputs.image-tag }}

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:${{ inputs.app-port }} > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2 seconds..."
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Fix workspace permissions for ZAP
        run: chmod 777 ${{ github.workspace }}

      - name: Run ZAP Baseline Scan
        run: |
          chmod 777 $GITHUB_WORKSPACE
          docker run --rm --network host \
            -v $GITHUB_WORKSPACE:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:${{ inputs.app-port }} \
            -J /zap/wrk/zap-results.json \
            -I || true

      - name: Generate ZAP SARIF
        if: always()
        run: |
          if [ ! -f zap-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"ZAP","rules":[]}},"results":[]}]}' > zap-results.sarif
          fi

      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && inputs.reporting-mode == 'sarif'
        with:
          sarif_file: zap-results.sarif
          category: zap

      - name: Upload ZAP SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always() && inputs.reporting-mode == 'artifacts'
        with:
          name: zap-sarif
          path: zap-results.sarif
          retention-days: 30

      - name: Upload Zap SARIF for DefectDojo
        uses: actions/upload-artifact@v4
        if: always() && inputs.defectdojo-url != ''
        with:
          name: dd-zap-sarif
          path: zap-results.sarif
          retention-days: 1

  defectdojo-import:
    name: DefectDojo Import
    runs-on: ubuntu-latest
    if: always() && inputs.defectdojo-url != ''
    needs:
      - secrets-scan
      - bandit-scan
      - semgrep-scan
      - pip-audit-scan
      - npm-audit-scan
      - build-and-sbom
      - trivy-scan
      - checkov-scan
      - zap-scan
    steps:
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dd-*-sarif
          path: sarifs/
          merge-multiple: true

      - name: Import findings into DefectDojo
        env:
          DD_URL: ${{ inputs.defectdojo-url }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pip install requests -q
          python3 << 'SCRIPT'
          import os, json, glob, sys
          import requests

          dd_url  = os.environ["DD_URL"].rstrip("/")
          token   = os.environ["DD_TOKEN"]
          repo    = os.environ["REPO"]
          sha     = os.environ["SHA"]
          product_name = repo.split("/")[-1]

          headers = {"Authorization": f"Token {token}"}

          def api(method, path, **kwargs):
              r = requests.request(method, f"{dd_url}/api/v2{path}", headers=headers, **kwargs)
              if not r.ok:
                  print(f"  ERROR {method} {path}: {r.status_code} {r.text[:200]}")
                  sys.exit(1)
              return r.json()

          # Find or create product
          resp = api("GET", f"/products/?name={product_name}&limit=1")
          if resp["count"] > 0:
              product_id = resp["results"][0]["id"]
              print(f"Found product: {product_name} (id={product_id})")
          else:
              result = api("POST", "/products/", json={
                  "name": product_name,
                  "description": f"Imported by SecurePipe from {repo}",
                  "prod_type": 1,
              })
              product_id = result["id"]
              print(f"Created product: {product_name} (id={product_id})")

          from datetime import date
          today = date.today().isoformat()

          # Create engagement for this run
          eng = api("POST", "/engagements/", json={
              "name": f"SecurePipe {sha[:8]}",
              "product": product_id,
              "target_start": today,
              "target_end": today,
              "engagement_type": "CI/CD",
              "status": "In Progress",
              "build_id": sha,
              "commit_hash": sha,
              "branch_tag": os.environ.get("GITHUB_REF_NAME", ""),
          })
          engagement_id = eng["id"]
          print(f"Created engagement: {eng['name']} (id={engagement_id})")

          # Import each SARIF file
          sarif_files = glob.glob("sarifs/*.sarif")
          if not sarif_files:
              print("No SARIF files found — skipping import")
              sys.exit(0)

          for sarif_path in sorted(sarif_files):
              tool_name = os.path.basename(sarif_path).replace("-results", "").replace(".sarif", "")
              print(f"  Importing {sarif_path} (tool: {tool_name})...")
              with open(sarif_path, "rb") as f:
                  api("POST", "/import-scan/", data={
                      "scan_type": "SARIF",
                      "engagement": engagement_id,
                      "active": "true",
                      "verified": "false",
                      "close_old_findings": "true",
                      "minimum_severity": "Info",
                  }, files={"file": (os.path.basename(sarif_path), f, "application/json")})
              print(f"    done")

          print(f"Import complete. View at {dd_url}/engagements/{engagement_id}/")
          SCRIPT


  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - secrets-scan
      - bandit-scan
      - semgrep-scan
      - pip-audit-scan
      - npm-audit-scan
      - build-and-sbom
      - trivy-scan
      - checkov-scan
      - zap-scan
      - defectdojo-import
    steps:
      - name: Print summary
        run: |
          echo "## Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST | ${{ needs.bandit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ${{ needs.semgrep-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit Dependency Scan | ${{ needs.pip-audit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm-audit Dependency Scan | ${{ needs.npm-audit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build and SBOM | ${{ needs.build-and-sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov IaC Scan | ${{ needs.checkov-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP ZAP DAST | ${{ needs.zap-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DefectDojo Import | ${{ needs.defectdojo-import.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cloud: \`${{ inputs.cloud-provider }}\` | Reporting: \`${{ inputs.reporting-mode }}\`" >> $GITHUB_STEP_SUMMARY
